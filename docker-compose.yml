services:
  db:
    image: postgres:15-alpine
    container_name: hakuyomi_voice_db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hakuyomi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hakuyomi_voice_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hakuyomi_user} -d ${POSTGRES_DB:-hakuyomi_voice_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hakuyomi-voice-api:latest
    container_name: hakuyomi_voice_api
    restart: unless-stopped
    # Garantizar ejecución sin privilegios root (UID:GID 10001:10001)
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-hakuyomi-voice-api}
      APP_ENV: ${APP_ENV:-production}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-hakuyomi-secret-api-token-2026}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hakuyomi_user:changeme_secure_password_2026@db:5432/hakuyomi_voice_db}
      STT_MODEL_NAME: ${STT_MODEL_NAME:-base}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      TTS_ENGINE: ${TTS_ENGINE:-piper-tts}
      PIPER_VOICE_MODEL: ${PIPER_VOICE_MODEL:-es_MX-ald-medium}
      MODEL_CACHE_DIR: /app/models
      TEMP_AUDIO_DIR: /tmp/hakuyomi_audio
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      TEMP_FILE_TTL_SECONDS: ${TEMP_FILE_TTL_SECONDS:-300}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - model_cache:/app/models
    # Almacenamiento temporal acotado en RAM/tmpfs (máx 256MB) con permisos para UID 10001
    tmpfs:
      - /tmp/hakuyomi_audio:size=256m,uid=10001,gid=10001,mode=1770
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  model_cache:
