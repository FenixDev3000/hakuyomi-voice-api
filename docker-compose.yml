# Compatible con docker-compose v1 (1.29.2), igual que la VM. Sin `name:` de primer nivel.
# Levantar con: docker-compose -p hakuyomi-voice up -d --build
version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: hakuyomi_voice_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sin puertos publicados: la base solo es accesible desde la red interna del compose.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV:-0}
    image: hakuyomi-voice-api:1.0.0
    container_name: hakuyomi_voice_api
    restart: always
    # Ejecución sin privilegios root (UID:GID 10001:10001)
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      APP_NAME: ${APP_NAME:-hakuyomi-voice-api}
      APP_ENV: ${APP_ENV:-production}
      DOCS_HABILITADAS: ${DOCS_HABILITADAS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      STT_MODEL_NAME: ${STT_MODEL_NAME:-base}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      TTS_ENGINE: ${TTS_ENGINE:-piper-tts}
      PIPER_VOICE_MODEL: ${PIPER_VOICE_MODEL:-es_MX-ald-medium}
      MODEL_CACHE_DIR: /app/models
      TEMP_AUDIO_DIR: /tmp/hakuyomi_audio
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      TEMP_FILE_TTL_SECONDS: ${TEMP_FILE_TTL_SECONDS:-300}
    # En la VM, VOICE_BIND y el puerto los pone Miyo.
    ports:
      - "${VOICE_BIND:-127.0.0.1}:${VOICE_PORT:-8000}:8000"
    # Almacenamiento temporal acotado en RAM (máx 256MB) con permisos para UID 10001
    tmpfs:
      - /tmp/hakuyomi_audio:size=256m,uid=10001,gid=10001,mode=1770
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: ${VOICE_DATA_VOLUME:-hakuyomi_voice_db_data}
